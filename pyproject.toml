[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extraction-pipeline"
version = "0.1.0"
description = "Document-to-structured-data service: LLM extraction, deterministic validation, human review, idempotency and an audit log."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anton Bryzhchuk" }]
keywords = ["llm", "document-extraction", "invoices", "fastapi", "validation", "human-in-the-loop"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
    "Jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
docpipe = "docpipe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docpipe = ["py.typed", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call a real LLM provider (skipped unless ANTHROPIC_API_KEY is set)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are called in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File", "fastapi.Query", "fastapi.Path"]
