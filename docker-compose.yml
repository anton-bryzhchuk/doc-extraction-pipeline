services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docpipe
      POSTGRES_PASSWORD: docpipe
      POSTGRES_DB: docpipe
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpipe"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://docpipe:docpipe@db:5432/docpipe
      DOCPIPE_PROFILE: good
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
