name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (mock only, no live suite)
        run: pytest -q -m "not live"

      - name: Generate synthetic invoices
        run: python -m docpipe generate

      - name: Evaluate (good profile)
        run: python -m docpipe evaluate --profile good

      - name: Demo -- validation catches bad extractions
        run: python -m docpipe demo-failures
