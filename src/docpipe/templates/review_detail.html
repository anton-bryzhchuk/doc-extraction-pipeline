<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review document #{{ doc.id }}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; max-width: 820px; }
    h1 { font-size: 1.3rem; }
    label { display: block; margin: 10px 0 2px; font-size: 0.85rem; color: #444; }
    input, textarea { width: 100%; padding: 6px 8px; font-size: 0.9rem; box-sizing: border-box; }
    textarea { font-family: ui-monospace, monospace; height: 180px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .failed { background: #fee2e2; border: 1px solid #fca5a5; padding: 10px 14px; border-radius: 6px; }
    .msg { background: #fef9c3; border: 1px solid #fde047; padding: 10px 14px; border-radius: 6px; }
    .actions { margin-top: 16px; }
    button { padding: 8px 16px; font-size: 0.9rem; margin-right: 8px; cursor: pointer; }
    .approve { background: #16a34a; color: white; border: none; border-radius: 6px; }
    .reject { background: #dc2626; color: white; border: none; border-radius: 6px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <p><a href="/review">&larr; Back to queue</a></p>
  <h1>Document #{{ doc.id }} — {{ doc.filename }}</h1>
  <p>Status: <strong>{{ doc.status }}</strong> · profile: {{ doc.profile }} · retries: {{ doc.retry_count }}</p>

  {% if message %}<p class="msg">{{ message }}</p>{% endif %}

  {% if doc.failed_rules %}
  <div class="failed">
    <strong>Failed rules:</strong> {{ doc.failed_rules | join(", ") }}
  </div>
  {% endif %}

  <form method="post" action="/review/{{ doc.id }}">
    <div class="grid">
      <div>
        <label>Supplier name</label>
        <input name="supplier_name" value="{{ extracted.get('supplier_name', '') }}">
      </div>
      <div>
        <label>Invoice number</label>
        <input name="invoice_number" value="{{ extracted.get('invoice_number', '') }}">
      </div>
      <div>
        <label>Invoice date (YYYY-MM-DD)</label>
        <input name="invoice_date" value="{{ extracted.get('invoice_date', '') }}">
      </div>
      <div>
        <label>Currency</label>
        <input name="currency" value="{{ extracted.get('currency', '') }}">
      </div>
      <div>
        <label>Net total</label>
        <input name="net_total" value="{{ extracted.get('net_total', '') }}">
      </div>
      <div>
        <label>VAT rate (fraction, e.g. 0.19)</label>
        <input name="vat_rate" value="{{ extracted.get('vat_rate', '') }}">
      </div>
      <div>
        <label>VAT amount</label>
        <input name="vat_amount" value="{{ extracted.get('vat_amount', '') }}">
      </div>
      <div>
        <label>Gross total</label>
        <input name="gross_total" value="{{ extracted.get('gross_total', '') }}">
      </div>
    </div>

    <label>Line items (JSON array)</label>
    <textarea name="line_items">{{ line_items_json }}</textarea>

    <div class="actions">
      <button class="approve" name="decision" value="approve" type="submit">Re-validate &amp; approve</button>
      <button class="reject" name="decision" value="reject" type="submit">Reject</button>
    </div>
  </form>
</body>
</html>
